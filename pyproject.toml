[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debate-agent-memory"
version = "0.1.0"
description = "A decoupled memory module for debate-style agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "luzuo01" }
]
keywords = ["agent", "memory", "debate", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[project.scripts]
debate-memory = "debate_agent_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_agent_memory"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
